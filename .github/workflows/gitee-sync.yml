name: Sync to Gitee

on:
  push:
    branches:
      - "backend"

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync backend branch to Gitee
        run: |
          git remote add gitee https://crackermmzz:${{ secrets.GITEE_TOKEN }}@gitee.com/crackermmzz/newaoe-frontend-backend.git

          # 只同步 backend 分支
          git push gitee backend

          # 同步 tag（可选）
          git push gitee --tags